<h1>Doble parámetros</h1>

@for(item of [].constructor(3);track $index){
<a [routerLink]="['/numerodoble', $index + 5]">
    Doble {{$index + 5  }}
</a><br>
}

<button (click)="goToHome()">Volver a casa.</button>
<button (click)="redirect()">Elige numero</button>
@if(numero){
<h2 style="color: green;">El doble del número {{numero}} es {{doble}}</h2>
}@else {
<h2 style="color: red;">No hemos recibido parámero</h2>
}
